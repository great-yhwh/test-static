<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переход в приложение</title>
    <script>
      (function() {
        var premiseId = "733713cf-29ba-42b5-bda3-50a819847e46";
        var packageName = "com.mintrocket.strana_development";
        
        var isAndroid = /Android/i.test(navigator.userAgent);
        var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        if (isAndroid) {
            var intentUrl = "intent://nps?premise_id=" + premiseId + 
                            "#Intent;scheme=strana;package=" + packageName + 
                            ";S.browser_fallback_url=https://play.google.com/store/apps/details?id=" + packageName + ";end";
            
            window.location.href = intentUrl;
        } 
        else if (isIOS) {
            window.location.href = "strana://nps?premise_id=" + premiseId;
        } 
        else {
            window.location.href = "strana://nps?premise_id=" + premiseId;
        }
      })();
    </script>
</head>
</body>
</html>
